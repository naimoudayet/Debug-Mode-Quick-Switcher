name: debugswitch-17

services:
  db:
    image: postgres:16
    container_name: debugswitch-pg-17
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: debugswitch-odoo-17
    depends_on:
      - db
    ports:
      - "13417:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./no_debug_quick_switcher:/mnt/extra-addons/no_debug_quick_switcher

volumes:
  db-data:
  odoo-data:
